# omnisync.conf.example'daki HTTPS sunucularının ortak proxy ayarları; /etc/nginx/snippets/'e kopyalanır.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:atagreen_ssl:10m;
ssl_session_timeout 1d;

server_tokens off;

location / {
    proxy_pass http://atagreen_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Tenant alt alan adından çözüldüğü için Host korunur. Web servisi istemci IP'sini yalnızca bu proxy'den gelen
    # X-Forwarded-For'dan alır (ATAGREEN_TRUSTED_PROXY); X-Forwarded-Proto ile stok servisi isteği HTTPS sayar.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_read_timeout 60s;
}
