name: AtaGreenTech CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.x'
  SOLUTION_PATH: 'AtaGreenTech.slnx'
  CLIENT_DIR: 'client'
  # OmniSync.Core.* paketleri OmniSyncCore reposuna bağlı; AtagreenTech GITHUB_TOKEN
  # ile okunamaz. Repo secret: classic PAT (read:packages) zorunlu.
  GITHUB_USERNAME: ${{ github.repository_owner }}
  GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN }}

jobs:
  # 1. Backend Build + Unit & E2E/Contract Testleri
  backend-ci:
    name: Backend (.NET 10 Build & Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require GitHub Packages credentials
        run: |
          if [ -z "${GITHUB_PACKAGES_TOKEN}" ]; then
            echo "::error::Missing secret GITHUB_PACKAGES_TOKEN. Create a classic PAT with read:packages and add it as a repository secret (Settings → Secrets → Actions). OmniSync.Core packages live under OmniSyncCore and are not readable with this repo's GITHUB_TOKEN."
            exit 1
          fi

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Authenticate NuGet GitHub Packages feed
        run: |
          dotnet nuget update source omnisync \
            --username "${GITHUB_USERNAME}" \
            --password "${GITHUB_PACKAGES_TOKEN}" \
            --store-password-in-clear-text \
            --configfile nuget.config

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build Release configuration
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Run Unit & E2E/Contract Integration Tests
        run: |
          dotnet test ${{ env.SOLUTION_PATH }} \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./TestResults

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: ./TestResults/*.trx
          if-no-files-found: ignore

  # 2. Frontend Type-Check, Lint & Production Build
  frontend-ci:
    name: Frontend (Type-Check, Lint & Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.CLIENT_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.CLIENT_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript Type-Check (tsc --noEmit)
        run: npm run type-check

      - name: Run Lint & Architecture Rules (#52)
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Build Production Bundle
        env:
          VITE_API_BASE_URL: /api/v1
        run: npm run build

  # 3. Docker İmaj Doğrulaması (UserService, StockService, Client)
  docker-verify:
    name: Docker Build Verification (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    strategy:
      fail-fast: true
      matrix:
        include:
          - service: userservice
            context: .
            dockerfile: src/Services/UserService/AtaGreenTech.UserService.Api/Dockerfile
          - service: stockservice
            context: .
            dockerfile: src/Services/StockService/AtaGreenTech.StockService.Api/Dockerfile
          - service: client
            context: client
            dockerfile: client/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Image Build (${{ matrix.service }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: false
          tags: atagreen-${{ matrix.service }}:ci-verify
          build-args: |
            GITHUB_USERNAME=${{ github.repository_owner }}
          secrets: |
            github_packages_token=${{ secrets.GITHUB_PACKAGES_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
